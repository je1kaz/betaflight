name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Назва плати'
        required: true
        default: 'GEPRCF745_BT_HD'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official Betaflight repository
        uses: actions/checkout@v4
        with:
          repository: betaflight/betaflight
          ref: 4.5-maintenance
          submodules: recursive

      - name: Patch VTX lock
        run: |
          sed -i 's/locked = 1;/\/\/ locked = 1;/g' src/main/io/vtx_control.c

      - name: Compile firmware
        run: |
          docker run --rm -u $(id -u):$(id -g) -v "$PWD":/src betaflight/betaflight-build:arm bash -c 'export PATH=$(find /opt/betaflight/tools -type d -name bin 2>/dev/null | tr "\n" ":"):$PATH && make configs && make CONFIG=${{ github.event.inputs.target }}'

      - name: Upload hex artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-${{ github.event.inputs.target }}-4.5.1
          path: obj/*.hex
